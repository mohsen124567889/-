<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#073b4c">
<meta name="description" content="نظام رِفاء المحلي لبيع وتوصيل مياه الشرب">
<link rel="manifest" href="manifest.webmanifest">
<title>رِفاء | مياه توصل لبابك</title>
<style>
:root{--navy:#073b4c;--blue:#087e8b;--cyan:#31c6d4;--mint:#dff7f5;--gold:#e6b85c;--ink:#17343d;--muted:#71858b;--bg:#f3f8f8;--white:#fff;--red:#d9534f;--green:#16865b;--line:#e4eeee;--shadow:0 12px 35px #073b4c12}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.app{max-width:1180px;margin:auto;min-height:100vh;padding-bottom:90px}.top{background:linear-gradient(130deg,#052f40,#087e8b);color:white;padding:22px 18px 28px;border-radius:0 0 28px 28px;box-shadow:var(--shadow)}.toprow{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:11px}.logo{width:45px;height:45px;border-radius:15px;background:#ffffff20;display:grid;place-items:center;font-size:25px;border:1px solid #ffffff35}.brand h1{font-size:21px;margin:0}.brand small{display:block;color:#c7eff0;font-size:11px}.role{background:#ffffff1c;color:white;border:1px solid #ffffff45;padding:9px 11px;border-radius:12px;max-width:150px}.hero{padding:23px 3px 0}.hero h2{font-size:25px;line-height:1.4;margin:0 0 6px}.hero p{margin:0;color:#d5eeee;font-size:13px}.content{padding:18px}.section-head{display:flex;align-items:center;justify-content:space-between;margin:8px 0 14px}.section-head h2{font-size:18px;margin:0}.muted{color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.card{background:white;border:1px solid var(--line);border-radius:19px;padding:15px;box-shadow:var(--shadow)}.product-art{height:105px;border-radius:15px;background:linear-gradient(145deg,#e4fbfa,#f4ffff);display:grid;place-items:center;font-size:54px;margin-bottom:12px}.product h3{font-size:15px;margin:0 0 5px}.price{font-weight:800;color:var(--blue);font-size:17px}.product-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px}.btn{background:var(--blue);color:white;padding:11px 15px;border-radius:12px;font-weight:700}.btn:active{transform:scale(.98)}.btn.secondary{background:#e9f5f5;color:var(--navy)}.btn.danger{background:#fff0ef;color:var(--red)}.btn.gold{background:var(--gold);color:#3e2b08}.btn.small{padding:8px 11px;font-size:12px}.wide{width:100%}.tabs{position:fixed;z-index:5;bottom:0;left:0;right:0;background:#ffffffed;backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:8px max(8px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom));gap:5px}.tab{background:transparent;color:#71858b;padding:8px 12px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;min-width:65px}.tab span:first-child{font-size:19px}.tab.active{background:var(--mint);color:var(--navy);font-weight:800}.panel{background:white;border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:13px;box-shadow:var(--shadow)}.field{display:flex;flex-direction:column;gap:6px;margin:11px 0}.field label{font-size:12px;font-weight:700;color:#536b72}.field input,.field select,.field textarea{border:1px solid #dce8e8;border-radius:11px;padding:12px;background:#fbfdfd;outline:none;width:100%;color:var(--ink)}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--cyan);box-shadow:0 0 0 3px #31c6d422}.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}.item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}.pill{font-size:11px;padding:5px 9px;border-radius:30px;background:#e8f5f4;color:var(--blue);white-space:nowrap}.pill.pending{background:#fff4dd;color:#97650c}.pill.done{background:#e4f7ed;color:var(--green)}.empty{text-align:center;padding:35px 15px;color:var(--muted)}.empty b{display:block;color:var(--ink);margin:8px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{background:#f0f9f8;border-radius:14px;padding:13px}.stat strong{display:block;font-size:22px;color:var(--navy)}.stat small{font-size:11px;color:var(--muted)}.notice{background:#fff8e8;border:1px solid #f4e3b9;border-radius:13px;padding:12px;font-size:12px;color:#78591e;line-height:1.7}.hidden{display:none!important}.qty{display:flex;align-items:center;gap:9px}.qty button{width:28px;height:28px;border-radius:9px;background:#eaf5f5;color:var(--navy);font-weight:900}.total{font-size:20px;font-weight:900;color:var(--navy)}.toast{position:fixed;z-index:10;bottom:90px;left:50%;transform:translateX(-50%);background:#123e49;color:white;padding:12px 17px;border-radius:12px;box-shadow:var(--shadow);font-size:13px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}.footer{text-align:center;color:#91a2a6;font-size:10px;padding:20px}
@media(max-width:650px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.content{padding:14px}.hero h2{font-size:22px}.card{padding:11px}.product-art{height:88px}.tabs{justify-content:space-around}.tab{min-width:0;padding:8px 9px}}
@media(max-width:360px){.grid{grid-template-columns:1fr}.role{max-width:120px}}
</style>
</head>
<body>
<div class="app">
<header class="top">
 <div class="toprow">
  <div class="brand"><div class="logo">💧</div><div><h1>رِفاء</h1><small>مياه نقية.. توصل لبابك</small></div></div>
  <select class="role" id="roleSelect" aria-label="تبديل الواجهة">
   <option value="customer">واجهة العميل</option><option value="admin">الإدارة</option><option value="driver">السائق</option>
  </select>
 </div>
 <div class="hero"><h2 id="welcome">انتعاشك يبدأ من رِفاء</h2><p id="subwelcome">اطلب مياهك بسهولة، ونجهز طلبك بكل عناية.</p></div>
</header>
<main class="content" id="main"></main>
<nav class="tabs" id="tabs"></nav>
<div class="footer">رِفاء للمياه · نسخة محلية على هذا الجهاز</div>
</div>
<div class="toast" id="toast"></div>
<script>
(()=>{
const $=s=>document.querySelector(s);
const money=n=>new Intl.NumberFormat('ar-SA',{style:'currency',currency:'SAR',maximumFractionDigits:2}).format(Number(n)||0);
const defaultProducts=[
{id:'p1',name:'مياه رِفاء 330 مل',size:'كرتون 40 حبة',price:18,stock:80,emoji:'💧',active:true},
{id:'p2',name:'مياه رِفاء 600 مل',size:'كرتون 24 حبة',price:17,stock:65,emoji:'🫗',active:true},
{id:'p3',name:'مياه رِفاء 1.5 لتر',size:'كرتون 12 حبة',price:16,stock:55,emoji:'🚰',active:true},
{id:'p4',name:'قارورة 5 جالون',size:'قارورة كبيرة',price:9,stock:100,emoji:'🧊',active:true},
{id:'p5',name:'حامل قارورة',size:'قطعة واحدة',price:35,stock:20,emoji:'🏺',active:true},
{id:'p6',name:'موزع مياه',size:'موزع مكتبي',price:95,stock:12,emoji:'⚙️',active:true}
];
const load=(k,d)=>{try{const x=localStorage.getItem('refaa_'+k);return x?JSON.parse(x):d}catch{return d}};
const save=(k,v)=>{try{localStorage.setItem('refaa_'+k,JSON.stringify(v))}catch(e){toast('تعذر الحفظ في مساحة الجهاز')}};
let products=load('products',defaultProducts),orders=load('orders',[]),cart=load('cart',[]),role=load('role','customer'),tab='home';
const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2200)}
function persist(){save('products',products);save('orders',orders);save('cart',cart);save('role',role)}
function setRole(v){role=v;tab=role==='customer'?'home':role==='admin'?'dashboard':'deliveries';persist();render()}
function nav(items){$('#tabs').innerHTML=items.map(x=>`<button class="tab ${tab===x.id?'active':''}" data-tab="${x.id}"><span>${x.icon}</span><span>${x.label}</span></button>`).join('');$('#tabs').querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()})}
function customer(){return [
{id:'home',label:'الرئيسية',icon:'⌂'},{id:'orders',label:'طلباتي',icon:'▤'},{id:'cart',label:'السلة',icon:'🛒'},{id:'account',label:'بياناتي',icon:'♙'}]}
function admin(){return [{id:'dashboard',label:'ملخص',icon:'▦'},{id:'manage',label:'المنتجات',icon:'📦'},{id:'orders',label:'الطلبات',icon:'▤'},{id:'settings',label:'إعدادات',icon:'⚙'}]}
function driver(){return [{id:'deliveries',label:'التوصيلات',icon:'🚚'},{id:'history',label:'السجل',icon:'✓'}]}
function render(){ $('#roleSelect').value=role;$('#welcome').textContent=role==='customer'?'انتعاشك يبدأ من رِفاء':role==='admin'?'لوحة إدارة رِفاء':'مهام التوصيل';$('#subwelcome').textContent=role==='customer'?'اطلب مياهك بسهولة، ونجهز طلبك بكل عناية.':role==='admin'?'تابع الطلبات والمنتجات والمخزون من مكان واحد.':'استعرض الطلبات المسندة لك وحدّث حالة التوصيل.';
nav(role==='customer'?customer():role==='admin'?admin():driver());
const pages=role==='customer'?customerPages:role==='admin'?adminPages:driverPages;
$('#main').innerHTML=(pages[tab]||pages[Object.keys(pages)[0]])();bind()}
function customerPages(){
return {
home:()=>`<div class="section-head"><h2>منتجاتنا</h2><span class="muted">${products.filter(p=>p.active).length} منتجات</span></div><div class="grid">${products.filter(p=>p.active).map(p=>productCard(p)).join('')}</div>`,
cart:()=>{let lines=cart.map(c=>({c,p:products.find(p=>p.id===c.id)})).filter(x=>x.p);let total=lines.reduce((s,x)=>s+x.p.price*x.c.qty,0);return `<div class="section-head"><h2>سلة مشترياتك</h2><span class="muted">${lines.length} أصناف</span></div>${lines.length?`<div class="panel">${lines.map(({c,p})=>`<div class="item"><div><b>${p.name}</b><div class="muted">${money(p.price)} · ${p.size}</div></div><div class="qty"><button data-minus="${p.id}">−</button><b>${c.qty}</b><button data-plus="${p.id}">+</button></div></div>`).join('')}<div class="item"><b>الإجمالي</b><span class="total">${money(total)}</span></div></div><div class="panel"><h3>بيانات التوصيل</h3><div class="field"><label>الاسم</label><input id="custName" placeholder="اسم المستلم"></div><div class="field"><label>رقم الجوال</label><input id="custPhone" inputmode="tel" placeholder="05xxxxxxxx"></div><div class="field"><label>العنوان بالتفصيل</label><textarea id="custAddress" rows="3" placeholder="المدينة، الحي، الشارع، أقرب علامة"></textarea></div><div class="field"><label>ملاحظات (اختياري)</label><input id="custNote" placeholder="مثلاً: الاتصال قبل الوصول"></div><div class="notice">الدفع عند الاستلام. هذه نسخة محلية، وسيُحفظ الطلب على هذا الجهاز فقط.</div><button class="btn wide" id="placeOrder">تأكيد الطلب · ${money(total)}</button></div>`:`<div class="panel empty">🛒<b>سلتك فارغة</b>أضف المنتجات التي تحتاجها من المتجر.</div>`},
orders:()=>orders.length?`<div class="section-head"><h2>طلباتي</h2><span class="muted">${orders.length} طلب</span></div>${orders.slice().reverse().map(orderCard).join('')}`:empty('لا توجد طلبات حتى الآن','ابدأ التسوق وستظهر طلباتك هنا.'),
account:()=>`<div class="panel"><h2>أهلاً بك في رِفاء</h2><p class="muted">يمكنك تقديم الطلبات ومتابعتها من هذا الجهاز.</p><div class="notice">ملاحظة: لا يوجد تسجيل دخول أو مزامنة سحابية في النسخة المحلية. لا تحفظ بيانات حساسة على جهاز مشترك.</div></div><div class="panel"><h3>معلومات التواصل</h3><p class="muted">أضف رقم خدمة العملاء من الإدارة عند توفره.</p></div>`
}}
function productCard(p){return `<article class="card product"><div class="product-art">${p.emoji||'💧'}</div><h3>${esc(p.name)}</h3><div class="muted">${esc(p.size||'')}</div><div class="product-foot"><div><div class="price">${money(p.price)}</div><div class="muted">المتاح: ${p.stock}</div></div><button class="btn small" data-add="${p.id}" ${p.stock<=0?'disabled':''}>أضف +</button></div></article>`}
function orderCard(o){let status=o.status||'جديد';let cls=status==='تم التسليم'?'done':status==='ملغي'?'':'pending';return `<div class="panel"><div class="item"><div><b>طلب #${o.id.slice(-6).toUpperCase()}</b><div class="muted">${new Date(o.created).toLocaleString('ar-SA')}</div></div><span class="pill ${cls}">${status}</span></div><div class="muted">${o.items.map(i=>`${esc(i.name)} × ${i.qty}`).join('، ')}</div><div class="item"><span>الإجمالي · الدفع عند الاستلام</span><b>${money(o.total)}</b></div>${o.note?`<div class="muted">ملاحظة: ${esc(o.note)}</div>`:''}</div>`}
function adminPages(){return {
dashboard:()=>`<div class="section-head"><h2>نظرة عامة</h2><span class="muted">محلي على هذا الجهاز</span></div><div class="stats"><div class="stat"><strong>${orders.length}</strong><small>كل الطلبات</small></div><div class="stat"><strong>${orders.filter(o=>o.status==='جديد').length}</strong><small>طلبات جديدة</small></div><div class="stat"><strong>${products.length}</strong><small>المنتجات</small></div></div><div class="section-head"><h2>أحدث الطلبات</h2></div>${orders.length?orders.slice().reverse().slice(0,5).map(o=>orderCard(o)).join(''):empty('لا توجد طلبات','ستظهر الطلبات التي تنشئها من واجهة العميل هنا على نفس الجهاز.')}`,
manage:()=>`<div class="section-head"><h2>إدارة المنتجات</h2><button class="btn small" id="newProduct">+ منتج</button></div><div class="panel" id="productForm" hidden><h3 id="formTitle">إضافة منتج</h3><input type="hidden" id="prodId"><div class="field"><label>اسم المنتج</label><input id="prodName" placeholder="اسم المنتج"></div><div class="field"><label>الوصف / الحجم</label><input id="prodSize" placeholder="كرتون 24 حبة"></div><div class="row"><div class="field"><label>السعر (ريال)</label><input id="prodPrice" type="number" min="0" step=".5"></div><div class="field"><label>المخزون</label><input id="prodStock" type="number" min="0"></div></div><div class="field"><label>رمز تعبيري</label><input id="prodEmoji" maxlength="4" placeholder="💧"></div><button class="btn" id="saveProduct">حفظ المنتج</button> <button class="btn secondary" id="cancelProduct">إلغاء</button></div>${products.map(p=>`<div class="panel"><div class="item"><div><b>${esc(p.name)}</b><div class="muted">${esc(p.size)} · ${money(p.price)} · مخزون ${p.stock}</div></div><span class="pill">${p.active?'نشط':'مخفي'}</span></div><div class="row"><button class="btn secondary small" data-edit="${p.id}">تعديل</button><button class="btn secondary small" data-toggle="${p.id}">${p.active?'إخفاء':'إظهار'}</button><button class="btn danger small" data-delete="${p.id}">حذف</button></div></div>`).join('')}`,
orders:()=>orders.length?`<div class="section-head"><h2>إدارة الطلبات</h2><span class="muted">${orders.length} طلب</span></div>${orders.slice().reverse().map(o=>`<div class="panel"><div class="item"><div><b>طلب #${o.id.slice(-6).toUpperCase()}</b><div class="muted">${esc(o.name)} · ${esc(o.phone)}</div></div><span class="pill ${o.status==='تم التسليم'?'done':'pending'}">${o.status}</span></div><div class="muted">${esc(o.address)}</div><div class="muted">${o.items.map(i=>`${esc(i.name)} × ${i.qty}`).join('، ')}</div><div class="item"><b>${money(o.total)}</b><span class="muted">الدفع عند الاستلام</span></div><div class="row"><select data-status="${o.id}">${['جديد','قيد التجهيز','خرج للتوصيل','تم التسليم','ملغي'].map(s=>`<option ${o.status===s?'selected':''}>${s}</option>`).join('')}</select><button class="btn danger small" data-removeorder="${o.id}">حذف</button></div></div>`).join('')`:empty('لا توجد طلبات','أنشئ طلباً من واجهة العميل لاختبار النظام.') ,
settings:()=>`<div class="panel"><h2>إعدادات ونسخ احتياطي</h2><p class="muted">البيانات محفوظة في تخزين المتصفح على هذا الجهاز فقط.</p><div class="notice">إذا حذفت بيانات المتصفح أو استخدمت جهازاً آخر فلن تنتقل البيانات. نزّل نسخة احتياطية بشكل دوري.</div><button class="btn wide" id="exportData">تصدير نسخة احتياطية JSON</button><div style="height:10px"></div><label class="btn secondary wide" style="display:block;text-align:center">استيراد نسخة احتياطية<input type="file" id="importData" accept=".json,application/json" hidden></label><div style="height:10px"></div><button class="btn danger wide" id="resetData">إعادة ضبط بيانات التطبيق</button></div><div class="panel"><h3>عن النسخة</h3><p class="muted">رِفاء — نظام محلي تجريبي قابل للتشغيل من ملفات الموقع. لا يتضمن بوابة دفع إلكترونية أو إرسال رسائل أو تتبع GPS.</p></div>`
}}
function driverPages(){return {
deliveries:()=>{let list=orders.filter(o=>!['تم التسليم','ملغي'].includes(o.status));return list.length?`<div class="section-head"><h2>طلبات التوصيل</h2><span class="muted">${list.length} طلب نشط</span></div>${list.slice().reverse().map(o=>`<div class="panel"><div class="item"><b>طلب #${o.id.slice(-6).toUpperCase()}</b><span class="pill pending">${o.status}</span></div><b>${esc(o.name)}</b><div class="muted">${esc(o.phone)}</div><p>${esc(o.address)}</p><div class="muted">${o.items.map(i=>`${esc(i.name)} × ${i.qty}`).join('، ')}</div><div class="item"><b>${money(o.total)}</b><span class="muted">تحصيل عند الاستلام</span></div><div class="row"><a class="btn secondary small" href="tel:${encodeURIComponent(o.phone)}">اتصال</a><button class="btn small" data-delivered="${o.id}">تم التسليم</button></div></div>`).join('')`:empty('لا توجد توصيلات حالياً','ستظهر الطلبات الجديدة هنا على نفس الجهاز.')},
history:()=>{let list=orders.filter(o=>['تم التسليم','ملغي'].includes(o.status));return list.length?list.slice().reverse().map(orderCard).join(''):empty('السجل فارغ','الطلبات المكتملة أو الملغاة ستظهر هنا.')}
}}
function empty(t,d){return `<div class="panel empty">💧<b>${t}</b>${d}</div>`}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function bind(){
document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{let p=products.find(x=>x.id===b.dataset.add);let c=cart.find(x=>x.id===p.id);if(!p||p.stock<=0)return toast('المنتج غير متوفر');if(c)c.qty++;else cart.push({id:p.id,qty:1});persist();toast('تمت الإضافة إلى السلة');render()});
document.querySelectorAll('[data-plus]').forEach(b=>b.onclick=()=>{let c=cart.find(x=>x.id===b.dataset.plus),p=products.find(x=>x.id===b.dataset.plus);if(c&&p&&c.qty<p.stock)c.qty++;else toast('لا توجد كمية إضافية بالمخزون');persist();render()});
document.querySelectorAll('[data-minus]').forEach(b=>b.onclick=()=>{let c=cart.find(x=>x.id===b.dataset.minus);if(c)c.qty--;cart=cart.filter(x=>x.qty>0);persist();render()});
$('#placeOrder')?.addEventListener('click',()=>{let name=$('#custName').value.trim(),phone=$('#custPhone').value.trim(),address=$('#custAddress').value.trim();if(!name||!phone||!address)return toast('أكمل الاسم والجوال والعنوان');if(!/^05\d{8}$/.test(phone))return toast('تحقق من رقم الجوال (05xxxxxxxx)');let items=cart.map(c=>{let p=products.find(x=>x.id===c.id);return p?{id:p.id,name:p.name,price:p.price,qty:c.qty}:null}).filter(Boolean);if(!items.length)return toast('السلة فارغة');for(let i of items){let p=products.find(x=>x.id===i.id);if(p.stock<i.qty)return toast(`المخزون لا يكفي: ${p.name}`)}items.forEach(i=>products.find(p=>p.id===i.id).stock-=i.qty);orders.push({id:id(),created:new Date().toISOString(),name,phone,address,note:$('#custNote').value.trim(),items,total:items.reduce((s,i)=>s+i.price*i.qty,0),status:'جديد'});cart=[];persist();toast('تم تسجيل الطلب على هذا الجهاز');tab='orders';render()});
$('#roleSelect').onchange=e=>setRole(e.target.value);
$('#newProduct')?.addEventListener('click',()=>{$('#productForm').hidden=false;$('#prodId').value='';$('#formTitle').textContent='إضافة منتج';['prodName','prodSize','prodPrice','prodStock','prodEmoji'].forEach(x=>$('#'+x).value='')});
$('#cancelProduct')?.addEventListener('click',()=>$('#productForm').hidden=true);
$('#saveProduct')?.addEventListener('click',()=>{let name=$('#prodName').value.trim(),price=Number($('#prodPrice').value),stock=Number($('#prodStock').value);if(!name||!Number.isFinite(price)||price<0||!Number.isInteger(stock)||stock<0)return toast('أدخل بيانات صحيحة');let pid=$('#prodId').value;let obj={id:pid||id(),name,size:$('#prodSize').value.trim(),price,stock,emoji:$('#prodEmoji').value.trim()||'💧',active:true};if(pid)products=products.map(p=>p.id===pid?{...p,...obj}:p);else products.push(obj);persist();toast('تم حفظ المنتج');render()});
document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{let p=products.find(x=>x.id===b.dataset.edit);$('#productForm').hidden=false;$('#formTitle').textContent='تعديل منتج';$('#prodId').value=p.id;$('#prodName').value=p.name;$('#prodSize').value=p.size;$('#prodPrice').value=p.price;$('#prodStock').value=p.stock;$('#prodEmoji').value=p.emoji;window.scrollTo({top:0,behavior:'smooth'})});
document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>{let p=products.find(x=>x.id===b.dataset.toggle);p.active=!p.active;persist();render()});
document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(confirm('حذف المنتج نهائياً؟')){products=products.filter(p=>p.id!==b.dataset.delete);cart=cart.filter(c=>c.id!==b.dataset.delete);persist();render()}});
document.querySelectorAll('[data-status]').forEach(s=>s.onchange=()=>{let o=orders.find(x=>x.id===s.dataset.status);o.status=s.value;persist();toast('تم تحديث حالة الطلب');render()});
document.querySelectorAll('[data-delivered]').forEach(b=>b.onclick=()=>{let o=orders.find(x=>x.id===b.dataset.delivered);o.status='تم التسليم';persist();toast('تم تحديث الطلب إلى تم التسليم');render()});
document.querySelectorAll('[data-removeorder]').forEach(b=>b.onclick=()=>{if(confirm('حذف هذا الطلب؟')){orders=orders.filter(o=>o.id!==b.dataset.removeorder);persist();render()}});
$('#exportData')?.addEventListener('click',()=>{let blob=new Blob([JSON.stringify({version:1,products,orders,cart,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='refaa-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href);toast('تم تجهيز النسخة الاحتياطية')});
$('#importData')?.addEventListener('change',async e=>{let f=e.target.files[0];if(!f)return;try{let d=JSON.parse(await f.text());if(!Array.isArray(d.products)||!Array.isArray(d.orders))throw Error();products=d.products;orders=d.orders;cart=Array.isArray(d.cart)?d.cart:[];persist();toast('تم استيراد النسخة');render()}catch{toast('ملف النسخة غير صالح')}});
$('#resetData')?.addEventListener('click',()=>{if(confirm('سيتم حذف جميع بيانات رِفاء المحلية. هل أنت متأكد؟')){products=defaultProducts.map(x=>({...x}));orders=[];cart=[];persist();toast('تمت إعادة الضبط');render()}});
}
$('#roleSelect').addEventListener('change',e=>setRole(e.target.value));
render();
if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script>
</body></html>
